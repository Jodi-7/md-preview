<!doctype html><html lang="zh-CN"><meta charset="utf-8"><style>html,body{margin:0;background:#F4F5F9}svg{display:block}</style><body><svg xmlns="http://www.w3.org/2000/svg" width="1240" height="742" viewBox="0 0 1240 742"><defs>
  <filter id="soft" x="-25%" y="-25%" width="150%" height="170%">
    <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#101828" flood-opacity="0.07"/>
  </filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="6.2" refY="3" orient="auto">
    <path d="M0.6,0.4 L6,3 L0.6,5.6" fill="none" stroke="#B4BCCB" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs><rect x="0" y="0" width="1240" height="742" rx="0" fill="#F4F5F9" stroke="none" stroke-width="1"/><text x="70" y="66" font-family="'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',system-ui,sans-serif" font-size="23" font-weight="700" font-style="" fill="#0E1626" text-anchor="start">这三个功能分别是干什么的</text><text x="70" y="94" font-family="'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',system-ui,sans-serif" font-size="13" font-weight="400" font-style="" fill="#475467" text-anchor="start">它们不在同一层：一个省操作、一个补语法、一个换产品形态</text><rect x="70" y="126" width="354" height="508" rx="18" fill="#FFFFFF" stroke="#E4E7EC" stroke-width="1" filter="url(#soft)"/><rect x="90" y="148" width="30" height="22" rx="7" fill="#E6F6FA" stroke="none" stroke-width="1"/><text x="105" y="163" font-family="'Cascadia Code',Consolas,ui-monospace,monospace" font-size="11" font-weight="700" font-style="" fill="#0E7490" text-anchor="middle">01</text><text x="404" y="163" font-family="'Cascadia Code',Consolas,ui-monospace,monospace" font-size="9.5" font-weight="700" font-style="" fill="#B4BCCB" text-anchor="end">INPUT</text><text x="90" y="204" font-family="'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',system-ui,sans-serif" font-size="19" font-weight="700" font-style="" fill="#0E1626" text-anchor="start">文件监听</text><text x="90" y="230" font-family="'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',system-ui,sans-serif" font-size="12" font-weight="400" font-style="" fill="#475467" text-anchor="start">你在 VS Code 里改文档，预览自己跟着变，不用再拖一次。</text><text x="90" y="258" font-family="'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',system-ui,sans-serif" font-size="10" font-weight="700" font-style="" fill="#B4BCCB" text-anchor="start">现在</text><rect x="90" y="270" width="314" height="76" rx="10" fill="#FAFBFC" stroke="#ECEEF3" stroke-width="1"/><text x="104" y="296" font-family="'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',system-ui,sans-serif" font-size="11.5" font-weight="400" font-style="" fill="#8A93A5" text-anchor="start">改完保存 → 回到预览器</text><text x="104" y="316" font-family="'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',system-ui,sans-serif" font-size="11.5" font-weight="400" font-style="" fill="#8A93A5" text-anchor="start">手动重新拖入或点一下文件</text><line x1="247" y1="358" x2="247" y2="380" stroke="#C3CAD6" stroke-width="1.4" marker-end="url(#arrow)"/><text x="90" y="394" font-family="'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',system-ui,sans-serif" font-size="10" font-weight="700" font-style="" fill="#0E7490" text-anchor="start">之后</text><rect x="90" y="406" width="314" height="100" rx="10" fill="#E6F6FA" stroke="none" stroke-width="1"/><text x="104" y="432" font-family="'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',system-ui,sans-serif" font-size="11.5" font-weight="600" font-style="" fill="#0E1626" text-anchor="start">保存 → 预览自动更新</text><text x="104" y="452" font-family="'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',system-ui,sans-serif" font-size="11.5" font-weight="600" font-style="" fill="#0E1626" text-anchor="start">滚动位置和阅读状态都保留</text><line x1="90" y1="538" x2="404" y2="538" stroke="#F0F2F6" stroke-width="1"/><text x="90" y="562" font-family="'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',system-ui,sans-serif" font-size="10" font-weight="700" font-style="" fill="#B4BCCB" text-anchor="start">代价</text><text x="90" y="582" font-family="'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" font-weight="400" font-style="" fill="#8A93A5" text-anchor="start">需要目录访问权限；Chrome / Edge 可用，Safari 与 Firefox</text><text x="90" y="599" font-family="'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" font-weight="400" font-style="" fill="#8A93A5" text-anchor="start"> 只能降级轮询。</text><rect x="443" y="126" width="354" height="508" rx="18" fill="#FFFFFF" stroke="#E4E7EC" stroke-width="1" filter="url(#soft)"/><rect x="463" y="148" width="30" height="22" rx="7" fill="#EEF1FF" stroke="none" stroke-width="1"/><text x="478" y="163" font-family="'Cascadia Code',Consolas,ui-monospace,monospace" font-size="11" font-weight="700" font-style="" fill="#4F46E5" text-anchor="middle">02</text><text x="777" y="163" font-family="'Cascadia Code',Consolas,ui-monospace,monospace" font-size="9.5" font-weight="700" font-style="" fill="#B4BCCB" text-anchor="end">RENDER</text><text x="463" y="204" font-family="'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',system-ui,sans-serif" font-size="19" font-weight="700" font-style="" fill="#0E1626" text-anchor="start">KaTeX 公式</text><text x="463" y="230" font-family="'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',system-ui,sans-serif" font-size="12" font-weight="400" font-style="" fill="#475467" text-anchor="start">把 $…$ 和 $$…$$ 之间的 LaTeX 排成真正的数学公式。</text><text x="463" y="258" font-family="'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',system-ui,sans-serif" font-size="10" font-weight="700" font-style="" fill="#B4BCCB" text-anchor="start">现在</text><rect x="463" y="270" width="314" height="76" rx="10" fill="#FAFBFC" stroke="#ECEEF3" stroke-width="1"/><text x="477" y="296" font-family="'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',system-ui,sans-serif" font-size="11.5" font-weight="400" font-style="" fill="#8A93A5" text-anchor="start">公式显示成原文：</text><text x="477" y="320" font-family="'Cascadia Code',Consolas,ui-monospace,monospace" font-size="12" font-weight="400" font-style="" fill="#8A93A5" text-anchor="start">$a^2 + b^2 = c^2$</text><line x1="620" y1="358" x2="620" y2="380" stroke="#C3CAD6" stroke-width="1.4" marker-end="url(#arrow)"/><text x="463" y="394" font-family="'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',system-ui,sans-serif" font-size="10" font-weight="700" font-style="" fill="#4F46E5" text-anchor="start">之后</text><rect x="463" y="406" width="314" height="100" rx="10" fill="#EEF1FF" stroke="none" stroke-width="1"/><text x="477" y="432" font-family="'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',system-ui,sans-serif" font-size="11.5" font-weight="600" font-style="" fill="#0E1626" text-anchor="start">公式排成正常版式：</text><text x="477" y="482" font-family="Georgia,'Times New Roman',serif" font-size="21" font-style="italic" fill="#0E1626"><tspan>a</tspan><tspan baseline-shift="super" font-size="13">2</tspan><tspan> + b</tspan><tspan baseline-shift="super" font-size="13">2</tspan><tspan> = c</tspan><tspan baseline-shift="super" font-size="13">2</tspan></text><line x1="463" y1="538" x2="777" y2="538" stroke="#F0F2F6" stroke-width="1"/><text x="463" y="562" font-family="'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',system-ui,sans-serif" font-size="10" font-weight="700" font-style="" fill="#B4BCCB" text-anchor="start">代价</text><text x="463" y="582" font-family="'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" font-weight="400" font-style="" fill="#8A93A5" text-anchor="start">约 78 KB gzip，动态加载不进首屏；只对写论文 / 算法笔记的</text><text x="463" y="599" font-family="'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" font-weight="400" font-style="" fill="#8A93A5" text-anchor="start">文档有意义。</text><rect x="816" y="126" width="354" height="508" rx="18" fill="#FFFFFF" stroke="#E4E7EC" stroke-width="1" filter="url(#soft)"/><rect x="836" y="148" width="30" height="22" rx="7" fill="#FDF3E4" stroke="none" stroke-width="1"/><text x="851" y="163" font-family="'Cascadia Code',Consolas,ui-monospace,monospace" font-size="11" font-weight="700" font-style="" fill="#B54708" text-anchor="middle">03</text><text x="1150" y="163" font-family="'Cascadia Code',Consolas,ui-monospace,monospace" font-size="9.5" font-weight="700" font-style="" fill="#B4BCCB" text-anchor="end">UI</text><text x="836" y="204" font-family="'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',system-ui,sans-serif" font-size="19" font-weight="700" font-style="" fill="#0E1626" text-anchor="start">双栏同步滚动</text><text x="836" y="230" font-family="'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',system-ui,sans-serif" font-size="12" font-weight="400" font-style="" fill="#475467" text-anchor="start">左边改、右边看，两边滚动互相对齐 —— 这已经是编辑器形态。</text><text x="836" y="258" font-family="'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',system-ui,sans-serif" font-size="10" font-weight="700" font-style="" fill="#B4BCCB" text-anchor="start">现在</text><rect x="836" y="270" width="314" height="76" rx="10" fill="#FAFBFC" stroke="#ECEEF3" stroke-width="1"/><text x="850" y="296" font-family="'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',system-ui,sans-serif" font-size="11.5" font-weight="400" font-style="" fill="#8A93A5" text-anchor="start">只能看。要改就切回编辑器，</text><text x="850" y="316" font-family="'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',system-ui,sans-serif" font-size="11.5" font-weight="400" font-style="" fill="#8A93A5" text-anchor="start">改完再回来重新打开</text><line x1="993" y1="358" x2="993" y2="380" stroke="#C3CAD6" stroke-width="1.4" marker-end="url(#arrow)"/><text x="836" y="394" font-family="'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',system-ui,sans-serif" font-size="10" font-weight="700" font-style="" fill="#B54708" text-anchor="start">之后</text><rect x="836" y="406" width="314" height="122" rx="10" fill="#FDF3E4" stroke="none" stroke-width="1"/><text x="850" y="432" font-family="'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',system-ui,sans-serif" font-size="11.5" font-weight="600" font-style="" fill="#0E1626" text-anchor="start">左边编辑 / 右边实时预览</text><text x="850" y="452" font-family="'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',system-ui,sans-serif" font-size="11.5" font-weight="600" font-style="" fill="#0E1626" text-anchor="start">滚一边，另一边跟着走</text><rect x="850" y="494" width="128" height="32" rx="7" fill="#FFFFFF" stroke="#E6D3B5" stroke-width="1"/><rect x="988" y="494" width="128" height="32" rx="7" fill="#FFFFFF" stroke="#E6D3B5" stroke-width="1"/><text x="914" y="515" font-family="'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',system-ui,sans-serif" font-size="11" font-weight="400" font-style="" fill="#8A93A5" text-anchor="middle">编辑</text><text x="1052" y="515" font-family="'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',system-ui,sans-serif" font-size="11" font-weight="400" font-style="" fill="#8A93A5" text-anchor="middle">预览</text><text x="983" y="515" font-family="'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',system-ui,sans-serif" font-size="13" font-weight="400" font-style="" fill="#B54708" text-anchor="middle">⇅</text><line x1="836" y1="538" x2="1150" y2="538" stroke="#F0F2F6" stroke-width="1"/><text x="836" y="562" font-family="'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',system-ui,sans-serif" font-size="10" font-weight="700" font-style="" fill="#B4BCCB" text-anchor="start">代价</text><text x="836" y="582" font-family="'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" font-weight="400" font-style="" fill="#8A93A5" text-anchor="start">范围最大：要引入编辑器内核、行号与滚动映射、脏状态管理。</text><rect x="70" y="662" width="1100" height="52" rx="12" fill="#FFFFFF" stroke="#ECEEF3" stroke-width="1" filter="url(#soft)"/><text x="90" y="693" font-family="'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',system-ui,sans-serif" font-size="11" font-weight="700" font-style="" fill="#B4BCCB" text-anchor="start">建议顺序</text><text x="160" y="693" font-family="'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',system-ui,sans-serif" font-size="12" font-weight="600" font-style="" fill="#0E1626" text-anchor="start">① 文件监听（收益最大、改动最小）</text><text x="390" y="693" font-family="'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',system-ui,sans-serif" font-size="12" font-weight="600" font-style="" fill="#0E1626" text-anchor="start">② KaTeX（独立可插拔，做不做都不影响别的）</text><text x="730" y="693" font-family="'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',system-ui,sans-serif" font-size="12" font-weight="600" font-style="" fill="#0E1626" text-anchor="start">③ 双栏同步（等于换产品形态，最后再考虑）</text></svg></body></html>
